services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-replay-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FASTF1_CACHE_DIR=/app/assets/cache
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - fastf1-cache:/app/assets/cache

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: f1-replay-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  fastf1-cache:
